# Ersetzt /etc/nginx/conf.d/default.conf im nginx-Image

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker-DNS: "api" wird erst bei jedem Request aufgelöst.
    # So startet nginx auch dann, wenn die API (noch) nicht läuft.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    set $api http://api:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api;
    }
}
