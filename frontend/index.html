<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>To-do</h1>
      <span id="version" class="badge">API: –</span>
    </header>

    <p id="error" class="error" hidden></p>

    <form id="new-todo">
      <input id="title" type="text" placeholder="Was ist zu tun?" autocomplete="off" required>
      <button type="submit">Hinzufügen</button>
    </form>

    <ul id="todos"></ul>
    <p id="empty" class="empty" hidden>Noch keine To-dos.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
